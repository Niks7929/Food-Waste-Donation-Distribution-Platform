spring.application.name=Food Waste Donation & Distribution Platform

# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# WAMP / MySQL Datasource Configuration (Port 3306)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:food_waste_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Flyway manages schema, Hibernate validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf Template Engine
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings
app.upload.dir=${UPLOAD_DIR:uploads/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Initial Admin Bootstrap (Environment Variables)
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:admin@123gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Platform Super Admin}
app.admin.phone=${ADMIN_PHONE:+919876543210}
app.seed.demo.data=${SEED_DEMO_DATA:false}

# Logging Configuration
logging.level.com.foodwaste.platform=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
