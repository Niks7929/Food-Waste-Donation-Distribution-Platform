<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage Organizations - Admin')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar('organizations')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Organization Management</h2>
                        <span class="text-muted">Review, approve, reject, and manage commercial donors and NGO partners</span>
                    </div>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Organization</th>
                                        <th>Role / Type</th>
                                        <th>License / Reg No</th>
                                        <th>Location</th>
                                        <th>Approval Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="org : ${orgPage.content}">
                                        <td>
                                            <div class="fw-bold" th:text="${org.organizationName}">Name</div>
                                            <small class="text-muted" th:text="${org.user.fullName} + ' (' + ${org.user.email} + ')'">Contact</small>
                                        </td>
                                        <td>
                                            <span class="badge bg-secondary mb-1" th:text="${org.user.role}">ROLE</span>
                                            <div class="small text-muted" th:text="${org.organizationType.displayName}">Type</div>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark border" th:text="${org.registrationNumber != null && !org.registrationNumber.isEmpty() ? org.registrationNumber : 'Not Specified'}">License</span>
                                        </td>
                                        <td>
                                            <div th:text="${org.city} + ', ' + ${org.state}">City, State</div>
                                            <small class="text-muted" th:text="${org.address}">Address</small>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="'badge-status-' + ${org.approvalStatus}" th:text="${org.approvalStatus}">STATUS</span>
                                        </td>
                                        <td>
                                            <div class="d-flex gap-2">
                                                <form th:if="${org.approvalStatus.name() != 'APPROVED'}" th:action="@{'/admin/organizations/' + ${org.id} + '/approve'}" method="post">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-success" title="Approve Organization">
                                                        <i class="bi bi-check-lg me-1"></i>Approve
                                                    </button>
                                                </form>

                                                <form th:if="${org.approvalStatus.name() != 'REJECTED'}" th:action="@{'/admin/organizations/' + ${org.id} + '/reject'}" method="post"
                                                      onsubmit="return confirm('Are you sure you want to reject/suspend this organization?');">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Reject Organization">
                                                        <i class="bi bi-x-lg me-1"></i>Reject
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${orgPage.empty}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            No organizations registered yet.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${orgPage.totalPages > 1}">
                        <span class="small text-muted" th:text="'Page ' + (${orgPage.number} + 1) + ' of ' + ${orgPage.totalPages}"></span>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${orgPage.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/organizations(page=${orgPage.number - 1})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${orgPage.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/organizations(page=${orgPage.number + 1})}">Next</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
