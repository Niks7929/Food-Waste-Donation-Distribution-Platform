<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Public Inquiries - Admin')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar('inquiries')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Public Inquiries &amp; Messages</h2>
                        <span class="text-muted">Messages sent from the public website contact form directly to Administration</span>
                    </div>
                    <div>
                        <span class="badge bg-primary px-3 py-2 fs-6">
                            <i class="bi bi-envelope-open me-1"></i>
                            <span th:text="${unreadCount}">0</span> Unread
                        </span>
                    </div>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Status</th>
                                        <th>Sender</th>
                                        <th>Organization / Role</th>
                                        <th>Message</th>
                                        <th>Received At</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${inquiriesPage.empty}">
                                        <td colspan="6" class="text-center py-5 text-muted">
                                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                            No inquiries received yet.
                                        </td>
                                    </tr>
                                    <tr th:each="inquiry : ${inquiriesPage.content}" th:classappend="${!inquiry.read ? 'table-light fw-semibold' : ''}">
                                        <td>
                                            <span th:if="${!inquiry.read}" class="badge bg-danger">
                                                <i class="bi bi-circle-fill me-1" style="font-size: 7px;"></i>NEW
                                            </span>
                                            <span th:if="${inquiry.read}" class="badge bg-secondary-subtle text-secondary border">
                                                READ
                                            </span>
                                        </td>
                                        <td>
                                            <div class="fw-bold" th:text="${inquiry.fullName}">Name</div>
                                            <a th:href="'mailto:' + ${inquiry.email}" class="small text-muted text-decoration-none">
                                                <i class="bi bi-envelope me-1"></i><span th:text="${inquiry.email}">email</span>
                                            </a>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark border"
                                                  th:text="${inquiry.roleOrOrg != null && !inquiry.roleOrOrg.isBlank() ? inquiry.roleOrOrg : 'Not Specified'}">
                                                Role / Org
                                            </span>
                                        </td>
                                        <td style="max-width: 320px;">
                                            <div class="text-break" th:text="${inquiry.message}">Message content</div>
                                        </td>
                                        <td class="small text-muted" th:text="${#temporals.format(inquiry.createdAt, 'dd MMM yyyy, hh:mm a')}">
                                            Date
                                        </td>
                                        <td>
                                            <div class="d-flex gap-1">
                                                <form th:if="${!inquiry.read}" th:action="@{/admin/inquiries/{id}/read(id=${inquiry.id})}" method="post" class="d-inline">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-success" title="Mark as Read">
                                                        <i class="bi bi-check2"></i>
                                                    </button>
                                                </form>
                                                <a th:href="'mailto:' + ${inquiry.email} + '?subject=Re: Inquiry on Food Waste Platform'" class="btn btn-sm btn-outline-primary" title="Reply via Email">
                                                    <i class="bi bi-reply-fill"></i>
                                                </a>
                                                <form th:action="@{/admin/inquiries/{id}/delete(id=${inquiry.id})}" method="post" class="d-inline"
                                                      onsubmit="return confirm('Delete this inquiry?');">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${inquiriesPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${inquiriesPage.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/inquiries(page=${inquiriesPage.number - 1})}">&laquo;</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, inquiriesPage.totalPages - 1)}"
                                th:classappend="${inquiriesPage.number == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/admin/inquiries(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${inquiriesPage.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/inquiries(page=${inquiriesPage.number + 1})}">&raquo;</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
