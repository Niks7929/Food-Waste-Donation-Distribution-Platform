<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('User Management - Admin')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar('users')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">User Account Directory</h2>
                        <span class="text-muted">Manage all registered accounts, roles, and authorization states</span>
                    </div>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>User</th>
                                        <th>Role</th>
                                        <th>Phone</th>
                                        <th>Registered Date</th>
                                        <th>Status</th>
                                        <th>Update Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${usersPage.content}">
                                        <td>
                                            <div class="fw-bold" th:text="${user.fullName}">Full Name</div>
                                            <small class="text-muted" th:text="${user.email}">email@example.com</small>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : (user.role.name() == 'DONOR' ? 'bg-success' : (user.role.name() == 'NGO' ? 'bg-warning text-dark' : 'bg-info text-dark'))}"
                                                  th:text="${user.role}">ROLE</span>
                                        </td>
                                        <td th:text="${user.phone}">Phone</td>
                                        <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">Date</td>
                                        <td>
                                            <span class="badge" th:classappend="'badge-status-' + ${user.accountStatus}" th:text="${user.accountStatus}">STATUS</span>
                                        </td>
                                        <td>
                                            <!-- Do not allow modifying primary admin status directly -->
                                            <div th:if="${user.role.name() != 'ADMIN'}">
                                                <form th:action="@{'/admin/users/' + ${user.id} + '/status'}" method="post" class="d-flex gap-1">
                                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                    <select name="status" class="form-select form-select-sm" style="width: auto;">
                                                        <option th:each="st : ${accountStatuses}" th:value="${st}" th:text="${st}" th:selected="${st == user.accountStatus}"></option>
                                                    </select>
                                                    <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                                                </form>
                                            </div>
                                            <span th:if="${user.role.name() == 'ADMIN'}" class="badge bg-light text-muted border">System Admin</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Pagination -->
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${usersPage.totalPages > 1}">
                        <span class="small text-muted" th:text="'Page ' + (${usersPage.number} + 1) + ' of ' + ${usersPage.totalPages}"></span>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item" th:classappend="${usersPage.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${usersPage.number - 1})}">Previous</a>
                            </li>
                            <li class="page-item" th:classappend="${usersPage.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/admin/users(page=${usersPage.number + 1})}">Next</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
