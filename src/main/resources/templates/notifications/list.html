<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Notifications')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container" style="max-width: 800px;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Notifications Center</h2>
                    <span class="text-muted" th:text="${unreadCount} + ' unread alerts'">0 unread alerts</span>
                </div>
                <div th:if="${unreadCount > 0}">
                    <form th:action="@{/notifications/read-all}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-sm btn-outline-success">
                            <i class="bi bi-check2-all me-1"></i>Mark All as Read
                        </button>
                    </form>
                </div>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item p-4 d-flex justify-content-between align-items-start"
                            th:each="n : ${notificationPage.content}"
                            th:classappend="${!n.isRead ? 'bg-light' : ''}">
                            <div class="me-3">
                                <div class="d-flex align-items-center mb-1">
                                    <span th:if="${!n.isRead}" class="badge bg-danger me-2" style="font-size: 0.65rem;">NEW</span>
                                    <h6 class="fw-bold mb-0" th:text="${n.title}">Notification Title</h6>
                                    <small class="text-muted ms-2" th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}">Time</small>
                                </div>
                                <p class="mb-0 text-secondary small" th:text="${n.message}">Notification message body.</p>
                            </div>
                            <div th:if="${!n.isRead}">
                                <form th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="Mark as read">
                                        <i class="bi bi-check"></i>
                                    </button>
                                </form>
                            </div>
                        </li>
                        <li class="list-group-item text-center py-5 text-muted" th:if="${notificationPage.empty}">
                            <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>
                            You have no notifications at this time.
                        </li>
                    </ul>
                </div>

                <!-- Pagination -->
                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${notificationPage.totalPages > 1}">
                    <span class="small text-muted" th:text="'Page ' + (${notificationPage.number} + 1) + ' of ' + ${notificationPage.totalPages}"></span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${notificationPage.first ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/notifications(page=${notificationPage.number - 1})}">Previous</a>
                        </li>
                        <li class="page-item" th:classappend="${notificationPage.last ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/notifications(page=${notificationPage.number + 1})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
