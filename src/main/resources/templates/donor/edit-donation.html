<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Edit Food Listing - Donor')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar('donations')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Edit Food Listing</h2>
                        <span class="text-muted">Update details for eligible food donation listing</span>
                    </div>
                    <a th:href="@{'/donor/donations/' + ${donation.id}}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
                    <form th:action="@{'/donor/donations/' + ${donation.id} + '/edit'}" th:object="${donation}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Food Name</label>
                                <input type="text" class="form-control" th:field="*{foodName}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Category</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.displayName}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Dietary Type</label>
                                <select class="form-select" th:field="*{foodType}" required>
                                    <option th:each="ft : ${foodTypes}" th:value="${ft}" th:text="${ft.displayName}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Total Quantity</label>
                                <input type="number" step="0.1" class="form-control" th:field="*{totalQuantity}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Quantity Unit</label>
                                <select class="form-select" th:field="*{quantityUnit}" required>
                                    <option th:each="u : ${units}" th:value="${u}" th:text="${u.displayName}"></option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Description</label>
                                <textarea class="form-control" rows="2" th:field="*{description}"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Prepared At</label>
                                <input type="datetime-local" class="form-control" th:field="*{preparedAt}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Pickup Deadline</label>
                                <input type="datetime-local" class="form-control" th:field="*{pickupDeadline}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Pickup Address</label>
                                <textarea class="form-control" rows="2" th:field="*{pickupAddress}" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Storage Instructions</label>
                                <input type="text" class="form-control" th:field="*{storageInstructions}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Allergen Information</label>
                                <input type="text" class="form-control" th:field="*{allergenInformation}">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success fw-bold px-4">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
