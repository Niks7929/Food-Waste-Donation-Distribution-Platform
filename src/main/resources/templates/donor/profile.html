<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Organization Profile - Donor')}"></head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: safety-banner}"></div>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>
            </div>

            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Donor Profile &amp; Contact Details</h2>
                        <span class="text-muted">Manage your business address, license numbers, and coordinator details</span>
                    </div>
                </div>

                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="card border-0 shadow-sm rounded-4 bg-white p-4 p-md-5">
                    <form th:action="@{/donor/profile}" th:object="${profile}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Organization / Business Name</label>
                                <input type="text" class="form-control" th:field="*{organizationName}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Organization Type</label>
                                <select class="form-select" th:field="*{organizationType}" required>
                                    <option th:each="t : ${orgTypes}" th:value="${t}" th:text="${t.displayName}"></option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Contact Person Name</label>
                                <input type="text" class="form-control" th:field="*{contactPersonName}" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Contact Phone Number</label>
                                <input type="tel" class="form-control" th:field="*{phone}" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Food Safety / Business License Number (FSSAI/GST)</label>
                                <input type="text" class="form-control" th:field="*{registrationNumber}">
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold">Pickup Address</label>
                                <textarea class="form-control" rows="2" th:field="*{address}" required></textarea>
                            </div>

                            <div class="col-md-5">
                                <label class="form-label fw-semibold">City</label>
                                <input type="text" class="form-control" th:field="*{city}" required>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">State</label>
                                <input type="text" class="form-control" th:field="*{state}" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Postal Code</label>
                                <input type="text" class="form-control" th:field="*{postalCode}" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success fw-bold px-4">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
